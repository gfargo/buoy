[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buoy"
version = "2.1.0"
description = "A lightweight, per-node system dashboard for homelabs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Griffen Fargo", email = "ghfargo@gmail.com" }]
keywords = ["homelab", "dashboard", "docker", "monitoring", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "starlette>=0.38,<1.0",
    "uvicorn[standard]>=0.52.1,<1.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
speedtest = [
    "speedtest-cli>=2.1,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx",  # for test client
]

[project.scripts]
buoy = "buoy.__main__:main"

# Third-party plugin packages register themselves for discovery by declaring an entry
# point under this group in their own pyproject.toml, pointing at a Plugin subclass
# (or a module that defines one):
#
#   [project.entry-points."buoy.plugins"]
#   weather = "buoy_plugin_weather:WeatherPlugin"
#
# Buoy's own built-in plugins are discovered by package scanning instead (see
# buoy.plugins.loader) and do not need an entry point here.

[project.urls]
Homepage = "https://github.com/gfargo/buoy"
Repository = "https://github.com/gfargo/buoy"
Issues = "https://github.com/gfargo/buoy/issues"

[tool.hatch.build.targets.wheel.force-include]
"static" = "buoy/static"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line too long — inline JS templates in plugins are intentionally long
    "F823",  # False positive for module-level globals referenced in functions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
