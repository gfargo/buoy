services:
  buoy:
    image: ghcr.io/gfargo/buoy:latest
    container_name: buoy
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./buoy.yaml:/config/buoy.yaml:ro
      - buoy-data:/data
      # Optional: mount a plugins directory for custom plugins
      # - ./plugins:/plugins:ro
      # Optional: mount TLS certs (read-only) for the cert_expiry plugin
      # - /etc/caddy/certs:/etc/caddy/certs:ro
    environment:
      - BUOY_AUTH_TOKEN=${BUOY_AUTH_TOKEN:-}
    # Required for full host metrics (temp, disk mounts, NVMe SMART).
    # For the same metrics without `privileged`, see docker-compose.hardened.yml.
    privileged: true
    pid: host
    # Optional: expose an NVIDIA GPU (requires the NVIDIA Container Toolkit
    # on the host — see docs/deployment/privilege-matrix.md).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Optional: expose an AMD/Intel GPU (reads /sys/class/drm + /dev/dri).
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  buoy-data:
