# Unprivileged deployment: service discovery + container stats only.
# See docs/deployment/privilege-matrix.md — this is "Tier 3" (no privileged,
# no hostPID). For a fuller-metrics DaemonSet variant, see daemonset.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buoy
  labels:
    app.kubernetes.io/name: buoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buoy
    spec:
      containers:
        - name: buoy
          image: ghcr.io/gfargo/buoy:latest
          args: ["--config", "/config/buoy.yaml"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: BUOY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buoy-auth
                  key: token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: config
          configMap:
            name: buoy-config
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: data
          emptyDir: {}
