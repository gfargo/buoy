{{- if and .Values.persistence.enabled (ne .Values.workloadKind "daemonset") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "buoy.fullname" . }}-data
  labels:
    {{- include "buoy.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
