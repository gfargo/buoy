# Config for the markdown link checker (.github/workflows/links.yml).
# https://lychee.cli.rs/usage/config/
no_progress = true
exclude_loopback = true
exclude_private = true

# Retry a bit harder than the defaults (3 retries / 1s) — github.com has been
# observed to intermittently drop connections with an HTTP/2 protocol error.
max_retries = 5
retry_wait_time = 5

exclude = [
  # RFC 2606-style example subdomains used as placeholders in the docs
  # (e.g. Tailscale tailnet examples like harbor.example.ts.net).
  '^https?://[a-z0-9.-]*\.example\.ts\.net',
  # Unresolvable example hostname used in a buoy.yaml.example config comment.
  '^https?://adguard(:[0-9]+)?',
  # Unresolvable example hostnames used in the reverse_proxy config comment
  # in buoy.yaml.example (Traefik/Caddy/NPM admin endpoints), not real hosts.
  '^https?://traefik(:[0-9]+)?',
  '^https?://caddy(:[0-9]+)?',
  '^https?://npm(:[0-9]+)?',
  # Unresolvable example hostnames used in buoy.yaml.example's
  # download_clients config comment (qBittorrent/SABnzbd containers).
  '^https?://qbittorrent(:[0-9]+)?',
  '^https?://sabnzbd(:[0-9]+)?',
  # Unresolvable example hostname used in buoy.yaml.example to illustrate the
  # Grafana/Alertmanager plugin's `url` config; not a real endpoint.
  '^https?://alertmanager(:[0-9]+)?',
  # Truncated example webhook URL in buoy.yaml.example ("...api/webhooks/...
  # "), not a real endpoint.
  '^https?://discord\.com/api/webhooks',
  # Example internal hostname used in buoy.yaml.example to illustrate
  # per-peer verify_ssl: false for self-signed certs; not a real host.
  '^https?://lab\.internal',
  # Placeholder hostname illustrating a reverse-proxy sub-path in
  # buoy.yaml.example, not a real endpoint.
  '^https?://host(:[0-9]+)?/',
  # Unresolvable example hostname used in buoy.yaml.example to illustrate the
  # Actual Budget plugin's `url` config (the actual-http-api sidecar); not a
  # real endpoint.
  '^https?://actual-http-api(:[0-9]+)?',
  # The hosted demo (buoy-demo.fly.dev) isn't provisioned yet — this exclusion
  # should be removed once `fly launch` has run and the app is live.
  '^https?://buoy-demo\.fly\.dev',
  # release-please-generated semver compare links necessarily point at the
  # not-yet-created target tag while a release PR is open, so they return 404
  # until that PR merges. The tags and release workflow verify the range after
  # merge; exclude only Buoy's generated compare URLs from pre-release checks.
  '^https?://github\.com/gfargo/buoy/compare/buoy-v[0-9]+\.[0-9]+\.[0-9]+\.\.\.buoy-v[0-9]+\.[0-9]+\.[0-9]+$',
]
