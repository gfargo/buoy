name: Feature Request
description: Suggest an idea or enhancement for buoy
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For larger changes, consider opening this issue first to discuss the approach
        before submitting a PR (see [CONTRIBUTING.md](../../CONTRIBUTING.md)).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that buoy doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've considered
    validations:
      required: false
