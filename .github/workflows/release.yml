name: Release

on:
  push:
    # release-please's manifest/component mode tags releases as "buoy-vX.Y.Z",
    # not the bare "vX.Y.Z" this used to match — confirmed 2026-08-23 that
    # every release since whenever that changed silently never triggered an
    # image publish (the plain "v*" pattern doesn't match a "buoy-v..." ref).
    tags: ["buoy-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action's `type=semver` needs a bare (optionally
      # "v"-prefixed) semver string — "buoy-v2.2.0" doesn't parse as one, so
      # strip the component prefix ourselves. On a workflow_dispatch run
      # (ref_name = a branch, not a tag) this just won't strip anything and
      # the resulting value fails semver parsing, which metadata-action
      # silently drops — latest/sha tags still get pushed either way.
      - id: version
        run: echo "value=${GITHUB_REF_NAME#buoy-}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
