name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=buoy --cov-report=term-missing --cov-fail-under=75
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/js/*.test.mjs

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: helm lint deploy/helm/buoy
      - name: Assert default and overridden workload versions
        run: |
          expected=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          helm template buoy deploy/helm/buoy --show-only templates/workload.yaml >/tmp/buoy-default.yaml
          python .github/scripts/assert_helm_workload.py \
            /tmp/buoy-default.yaml Deployment "ghcr.io/gfargo/buoy:$expected" "$expected"

          helm template buoy deploy/helm/buoy --show-only templates/workload.yaml \
            --set-string image.tag=_canary >/tmp/buoy-canary.yaml
          python .github/scripts/assert_helm_workload.py \
            /tmp/buoy-canary.yaml Deployment 'ghcr.io/gfargo/buoy:_canary' canary

          long_tag=$(python -c 'print("a" * 70)')
          expected_label=$(python -c 'print("a" * 63)')
          helm template buoy deploy/helm/buoy --show-only templates/workload.yaml \
            --set workloadKind=daemonset --set-string image.tag="$long_tag" >/tmp/buoy-daemonset.yaml
          python .github/scripts/assert_helm_workload.py \
            /tmp/buoy-daemonset.yaml DaemonSet "ghcr.io/gfargo/buoy:$long_tag" "$expected_label"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # load: true only supports a single platform, so this can't reuse the
      # multi-arch manifest from the build job; it re-resolves amd64 layers
      # from the shared GHA cache instead (fast, since build already
      # populated that cache for amd64).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: buoy:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run demo container
        run: docker run -d --name buoy-smoke -p 8090:8090 buoy:smoke --demo
      - name: Wait for health and assert status ok
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/api/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          grep -qE '"status":\s*"ok"' /tmp/health.json
      - name: Assert container version consistency
        run: |
          expected=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          cli_version=$(docker exec buoy-smoke buoy --version)
          health_version=$(python -c 'import json; print(json.load(open("/tmp/health.json"))["version"])')
          deploy_version=$(curl -fsS http://localhost:8090/api/deploy-info | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          test "$cli_version" = "buoy $expected"
          test "$health_version" = "$expected"
          test "$deploy_version" = "$expected"
      - name: Assert root serves HTML
        run: |
          body=$(curl -fsS http://localhost:8090/)
          echo "$body" | grep -qi '<html'
      - name: Container logs on failure
        if: failure()
        run: docker logs buoy-smoke || true
