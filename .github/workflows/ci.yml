name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=buoy --cov-report=term-missing --cov-fail-under=75
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/js/*.test.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: buoy:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run demo container
        run: docker run -d --name buoy-smoke -p 8090:8090 buoy:smoke --demo
      - name: Wait for health and assert status ok
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/api/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          grep -qE '"status":\s*"ok"' /tmp/health.json
      - name: Assert root serves HTML
        run: |
          body=$(curl -fsS http://localhost:8090/)
          echo "$body" | grep -qi '<html'
      - name: Container logs on failure
        if: failure()
        run: docker logs buoy-smoke || true
