name: Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync labels from .github/labels.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            description=$(jq -r '.description' <<<"$label")
            gh label create "$name" --color "$color" --description "$description" --force
          done

          # Prune labels that are no longer declared in labels.json, so the
          # taxonomy stays a strict mirror of the source of truth instead of
          # only ever growing.
          gh label list --json name --limit 200 | jq -r '.[].name' | while read -r existing; do
            if ! jq -e --arg n "$existing" 'any(.[]; .name == $n)' .github/labels.json >/dev/null; then
              gh label delete "$existing" --yes
            fi
          done
